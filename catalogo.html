<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <title>Catálogo de Veículos</title>
  <style>
    :root { --red:#c1121f; --red-dark:#8f0e18; --white:#fff; --gray:#fafafa; }
    body { margin:0; font-family:Arial; background:var(--gray); }
    header { background:var(--red); color:var(--white); padding:16px; display:flex; justify-content:space-between; }
    header a { color:var(--white); margin-left:12px; text-decoration:none; font-weight:bold; }
    .wrap { max-width:1100px; margin:24px auto; }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
    .card { background:var(--white); border:1.5px solid var(--red); border-radius:12px; overflow:hidden; }
    .thumb { height:160px; background:linear-gradient(45deg,var(--red),var(--red-dark)); }
    .card-body { padding:12px; }
    h3 { margin:0; color:var(--red-dark); }
    .meta { color:#555; font-size:0.9rem; }
    .price { font-weight:bold; color:var(--red-dark); margin-top:6px; }
    .btn { display:inline-block; margin-top:8px; background:var(--red); color:var(--white); padding:8px 12px; border-radius:8px; text-decoration:none; }
    .thumb {
  width: 100%;
  height: 160px;
  object-fit: cover; /* mantém proporção sem distorcer */
  border-radius: 8px;
  border: 1.5px solid var(--red);
}

 </style>

</head>
<body>
  <header>
    <div><strong>Locadora de Veículos</strong></div>
    <nav>
      <a href="login.html">Login</a>
      <a href="carrinho.html">Reservas</a>
    </nav>
  </header>
  <main class="wrap">
    <h1>Catálogo</h1>
    <section class="grid">
      <article class="card">
        <img class="thumb" src="fiat.jpg" alt="Fiat Argo">
        <div class="card-body">
          <h3>Fiat Argo</h3>
          <div class="meta">Compacto • Automático • Ar-condicionado</div>
          <div class="price">R$ 120/dia</div>
          <a class="btn" href="detalhes.html">Detalhes</a>
        </div>
      </article>
      <article class="card">
        <img class="thumb" src="chevrolet.jpg" alt="chevrolet tracker">
        <div class="card-body">
          <h3>Chevrolet Tracker</h3>
          <div class="meta">SUV • Automático • GPS</div>
          <div class="price">R$ 180/dia</div>
          <a class="btn" href="detalhes.html">Detalhes</a>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
